<!DOCTYPE html>
<!--
  ============================================================================
  404.html
  ----------------------------------------------------------------------------
  Página de erro personalizada exibida pelo GitHub Pages quando uma rota não é
  encontrada. Mantém a identidade visual do site e oferece um caminho de volta
  à página inicial.
  ============================================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada | Nicollas Andreas</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <canvas id="neural-bg" aria-hidden="true"></canvas>
  <main style="display:grid;place-items:center;min-height:80vh;text-align:center;padding-top:6rem;">
    <div>
      <span class="eyebrow">Erro 404</span>
      <h1 style="font-size:clamp(2.4rem,8vw,4rem);">Página não encontrada</h1>
      <p class="lead" style="margin:0 auto 1.6rem;">
        O endereço que você procurou não existe ou foi movido.
      </p>
      <a class="btn btn-primary" href="index.html">Voltar para a home</a>
    </div>
  </main>
  <script type="module" src="js/error.js"></script>
</body>
</html>
